[package]
name = "pulse"
version = "0.1.0"
description = "Pulse — Service Monitor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Off until updater signing keys exist. Does not change the default binary.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
# Lets secret header values sit in services.json. CI does not enable this.
debug-plaintext-secrets = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2"
url = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = [
    "native-tls",
    "native-tls-alpn",
    "macos-system-configuration",
    "gzip",
    "brotli",
    "http2",
    "charset",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri-plugin-log = "2"
log = "0.4"
open = "5"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Same major as keyring 3.6's macOS crate so PlatformFailure downcast works.
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
    "NSNotification",
    "NSOperation",
    "NSString",
    "block2",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSWorkspace",
    "block2",
] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }
# First notify-enabled save: real UNUserNotificationCenter prompt (plugin is a no-op on desktop).
objc2-user-notifications = "0.3.2"
block2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
