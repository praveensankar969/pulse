name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          notes="$(cat <<EOF
          Pulse ${tag} for Mac (Apple silicon).

          Unsigned build. After unzipping:

          1. Right-click Pulse.app → Open
          2. Confirm Open
          3. On the first secret check, choose Always Allow for Keychain

          Attach **Pulse.app.zip** (from \`pnpm tauri build --bundles app\`) to this release. The website Download button uses the latest zip on this release.

          Privacy: https://github.com/${{ github.repository }}/blob/main/docs/privacy.html
          Terms: https://github.com/${{ github.repository }}/blob/main/docs/terms.html
          EOF
          )"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Pulse ${tag}" --notes "$notes" --latest
          else
            gh release create "$tag" --title "Pulse ${tag}" --notes "$notes" --latest
          fi
