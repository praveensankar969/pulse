name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          notes="$(cat <<EOF
          Pulse ${tag} for Mac (Apple silicon).

          Unsigned — no Apple Developer ID. Source: this repository.

          1. Open the DMG and drag Pulse.app to Applications
          2. In Terminal:
             \`xattr -cr /Applications/Pulse.app\`
          3. Open Pulse. On the first secret check, choose Always Allow for Keychain

          Attach **Pulse_*_aarch64.dmg** (from \`pnpm tauri build --bundles dmg\`) to this release. The website Download button uses the latest .dmg on this release.

          Privacy: https://github.com/${{ github.repository }}/blob/master/docs/privacy.html
          Terms: https://github.com/${{ github.repository }}/blob/master/docs/terms.html
          EOF
          )"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Pulse ${tag}" --notes "$notes" --latest
          else
            gh release create "$tag" --title "Pulse ${tag}" --notes "$notes" --latest
          fi
